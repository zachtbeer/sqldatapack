name: Docs PR

# docs.yml builds and deploys on push to main, so nothing checked the site before it
# merged. This is that check: same build, no Pages upload and no deploy. Worth having
# because docusaurus.config.js sets onBrokenLinks and onBrokenMarkdownLinks to throw,
# so the build fails on a dead internal link rather than shipping one.
on:
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/docs-pr.yml'

permissions:
  contents: read

# A rerun on the next push to the branch replaces the one in flight.
concurrency:
  group: docs-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
      - run: npm run build
