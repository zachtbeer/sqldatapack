name: Release

# Builds and publishes one version. Normally called by publish.yml, which computes
# the version from the semver: label on the merged pull request and pushes the tag
# before calling. A pushed v* tag also triggers it directly, which is how a release
# candidate gets published by hand:
#
#     dotnet run build/VersionGuard.cs -- 1.1.0-rc.1   # same checks this workflow runs
#     git tag -a v1.1.0-rc.1 -m "v1.1.0-rc.1"
#     git push origin v1.1.0-rc.1
#
# Use the manual trigger with dry_run to rehearse against an existing tag without
# publishing anything.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, pack and validate without publishing"
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        description: "The version to publish, with no leading v"
        type: string
        required: true
      dry_run:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything that used to be a step in .github/AGENTS.md the maintainer had to
  # remember. Nothing publishes unless this passes.
  guard:
    name: Version guard
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.guard.outputs.version }}
      prerelease: ${{ steps.guard.outputs.prerelease }}
      publish: ${{ steps.mode.outputs.publish }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Full history so git describe can see the release tags.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # A tag push and a call from publish.yml both publish. A manual run publishes
      # only when dry_run is cleared, which is the rehearsal path. inputs.dry_run is
      # empty on a tag push, so that case falls through to publishing.
      - name: Resolve mode
        id: mode
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dry run. Nothing will be published."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Called from publish.yml the version is given, and the tag was pushed just
      # before the call. On a tag push it comes from the ref. On a manual run HEAD may
      # sit on a tag pushed earlier, so fall back to describing HEAD.
      - name: Resolve version
        id: tag
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/}" ]; then
            tag="${GITHUB_REF#refs/tags/}"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          elif tag=$(git describe --tags --exact-match HEAD 2>/dev/null); then
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::HEAD carries no tag. Tag the commit before running this workflow."
            exit 1
          fi

      - name: Check version
        id: guard
        run: dotnet run build/VersionGuard.cs -- "${{ steps.tag.outputs.version }}"

  release:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Full history so git describe can see the release tags.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: nuget-

      # The version has to reach the build, not just the pack. Packing with --no-build
      # and a version the build never saw produces a package whose assembly and nupkg
      # disagree.
      - run: dotnet restore SqlDataPack.slnx --locked-mode
      - run: dotnet build SqlDataPack.slnx -c Release --no-restore -p:Version=${{ needs.guard.outputs.version }}
      # Unit tests only. The integration suite needs SQL Server containers and runs in
      # ci.yml's matrix against 2017/2019/2022/2025; re-running it here would pull those
      # images on every release.
      - run: dotnet test tests/SqlDataPack.Tests/SqlDataPack.Tests.csproj -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/SqlDataPack/SqlDataPack.csproj -c Release --no-build -o ./release-packages -p:Version=${{ needs.guard.outputs.version }}

      # The version is passed into build and pack explicitly, so this asserts the
      # artifact on disk is the one the tag promised before anything is published.
      - name: Verify package version matches the tag
        env:
          EXPECTED: ${{ needs.guard.outputs.version }}
        run: |
          if [ ! -f "./release-packages/SqlDataPack.${EXPECTED}.nupkg" ]; then
            echo "::error::Expected SqlDataPack.${EXPECTED}.nupkg. Pack produced:"
            ls -1 ./release-packages/
            exit 1
          fi

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-packages
          path: |
            ./release-packages/*.nupkg
            ./release-packages/*.snupkg

      # Attest the nupkg bytes we built, before publishing. nuget.org appends a
      # repository signature to the published package, which changes its bytes and
      # invalidates this attestation when verified against the nuget.org file. The
      # attestation bundle and the exact attested nupkg are therefore attached to the
      # GitHub release below, and the README documents verifying against that file.
      - name: Attest build provenance
        id: attest
        if: needs.guard.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "./release-packages/*.nupkg"

      - name: Generate SBOM (CycloneDX)
        run: |
          dotnet tool install --global CycloneDX --version 6.2.0
          dotnet CycloneDX src/SqlDataPack/SqlDataPack.csproj -o ./sbom -j --set-version "${{ needs.guard.outputs.version }}"

      - name: NuGet login (OIDC trusted publishing)
        if: needs.guard.outputs.publish == 'true'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        if: needs.guard.outputs.publish == 'true'
        run: dotnet nuget push "./release-packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Push symbols to NuGet.org
        if: needs.guard.outputs.publish == 'true'
        run: dotnet nuget push "./release-packages/*.snupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

      # Notes are generated from the pull requests merged since the previous tag, so a
      # pull request title is what readers eventually see. The readable, narrative
      # account of the project lives on the docs site and is not tied to a version.
      # Runs on dry runs too, so a rehearsal shows exactly what the release would say.
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          previous=$(git tag --list 'v*' --sort=-v:refname | grep -Fxv "v${VERSION}" | head -1)
          if [ -n "${previous}" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="v${VERSION}" -f previous_tag_name="${previous}" \
              --jq '.body' > ./release-notes.md
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="v${VERSION}" --jq '.body' > ./release-notes.md
          fi
          echo "## Release notes for v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          cat ./release-notes.md >> "$GITHUB_STEP_SUMMARY"

      # Prereleases are marked as such, so a release candidate does not display as
      # "Latest" on the releases page.
      - name: Create GitHub Release
        if: needs.guard.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" ./release-packages/provenance.intoto.jsonl
          gh release create "v${VERSION}" \
            ./release-packages/*.nupkg \
            ./sbom/bom.json \
            ./release-packages/provenance.intoto.jsonl \
            -t "v${VERSION}" \
            --notes-file ./release-notes.md \
            ${{ needs.guard.outputs.prerelease == 'true' && '--prerelease' || '--latest' }}
