name: Release

# Builds and publishes one version. Push a tag and this does the rest:
#
#     dotnet run build/VersionGuard.cs -- 1.1.0    # prints the next two lines for you
#     git tag -a v1.1.0 -m "v1.1.0"
#     git push origin v1.1.0
#
# A preview is the same three commands with 1.1.0-preview.1. Prerelease-ness is read off
# the version string, so there is no separate workflow for it.
#
# This is deliberately the only file in the repository that can reach `dotnet nuget push`,
# which is what keeps it to a single trusted publishing policy on nuget.org. That policy
# names release.yml and covers every trigger below. Publishing from a second workflow, or
# calling this one with workflow_call, means a second policy and a second thing to get
# wrong; the repository had three of those and it went badly. Add triggers here instead.
#
# Use the manual trigger with dry_run to rehearse against an existing tag without
# publishing anything.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, pack and validate without publishing"
        type: boolean
        default: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything that used to be a step in .github/AGENTS.md the maintainer had to
  # remember. Nothing publishes unless this passes.
  guard:
    name: Version guard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      version: ${{ steps.guard.outputs.version }}
      prerelease: ${{ steps.guard.outputs.prerelease }}
      publish: ${{ steps.mode.outputs.publish }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so git describe can see the release tags.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # A tag push publishes. A manual run publishes only when dry_run is cleared, which
      # is the rehearsal path. inputs.dry_run is empty on a tag push, so that case falls
      # through to publishing.
      - name: Resolve mode
        id: mode
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dry run. Nothing will be published."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # On a tag push the version comes from the ref. On a manual run HEAD may sit on a
      # tag pushed earlier, so fall back to describing HEAD.
      - name: Resolve version
        id: tag
        run: |
          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/}" ]; then
            tag="${GITHUB_REF#refs/tags/}"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          elif tag=$(git describe --tags --exact-match HEAD 2>/dev/null); then
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::HEAD carries no tag. Tag the commit before running this workflow."
            exit 1
          fi

      - name: Check version
        id: guard
        run: dotnet run build/VersionGuard.cs -- "${{ steps.tag.outputs.version }}"

  # The standalone builds, which is how most people get this: winget on Windows, a
  # direct download everywhere else. Self-contained and single file, so the target
  # machine needs no .NET at all.
  #
  # Each RID builds on its own operating system rather than cross-publishing from
  # ubuntu. Cross-publishing works, but it leaves the macOS binaries unsigned in a way
  # that is harder to fix later, and the runners cost nothing.
  binaries:
    name: Build ${{ matrix.rid }}
    needs: guard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # No --locked-mode: publishing for a RID pulls runtime packs the lock file was not
      # written against.
      - name: Publish
        shell: bash
        run: |
          dotnet publish src/SqlDataPack.Cli/SqlDataPack.Cli.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:Version=${{ needs.guard.outputs.version }} \
            -o ./publish/${{ matrix.rid }}

      # The publish settings are supposed to produce exactly one file. If they ever stop
      # doing so, the archive layout and the winget manifest are both wrong, so fail here
      # rather than ship it. SingleFileCliTests covers the same property in the test suite.
      - name: Verify the build is a single file
        shell: bash
        run: |
          count=$(find ./publish/${{ matrix.rid }} -type f | wc -l)
          if [ "${count}" -ne 1 ]; then
            echo "::error::Expected one self-contained file for ${{ matrix.rid }}, found ${count}:"
            find ./publish/${{ matrix.rid }} -type f
            exit 1
          fi

      # Windows ships the bare executable so the winget portable manifest can point
      # straight at it. Everything else is tarred to keep the executable bit.
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p ./artifacts
          case "${{ matrix.rid }}" in
            win-*)
              cp "./publish/${{ matrix.rid }}/SqlDataPack.Cli.exe" "./artifacts/sqldatapack-${{ matrix.rid }}.exe"
              ;;
            *)
              cp "./publish/${{ matrix.rid }}/SqlDataPack.Cli" "./publish/${{ matrix.rid }}/sqldatapack"
              chmod +x "./publish/${{ matrix.rid }}/sqldatapack"
              tar -czf "./artifacts/sqldatapack-${{ matrix.rid }}.tar.gz" -C "./publish/${{ matrix.rid }}" sqldatapack
              ;;
          esac
          ls -l ./artifacts

      # Cheap proof the thing runs at all before it reaches anyone. Only where the
      # runner can execute the architecture it just built.
      - name: Smoke test
        if: matrix.rid == 'win-x64' || matrix.rid == 'linux-x64' || matrix.rid == 'osx-arm64'
        shell: bash
        run: |
          case "${{ matrix.rid }}" in
            win-*) ./publish/${{ matrix.rid }}/SqlDataPack.Cli.exe --version ;;
            *)     ./publish/${{ matrix.rid }}/sqldatapack --version ;;
          esac

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.rid }}
          path: ./artifacts/*

  release:
    needs: [guard, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so git describe can see the release tags.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: nuget-

      # The version has to reach the build, not just the pack. Packing with --no-build
      # and a version the build never saw produces a package whose assembly and nupkg
      # disagree.
      - run: dotnet restore SqlDataPack.slnx --locked-mode
      - run: dotnet build SqlDataPack.slnx -c Release --no-restore -p:Version=${{ needs.guard.outputs.version }}
      # Unit tests only. The integration suite needs SQL Server containers and runs in
      # ci.yml's matrix against 2017/2019/2022/2025; re-running it here would pull those
      # images on every release.
      - run: dotnet test tests/SqlDataPack.Tests/SqlDataPack.Tests.csproj -c Release --no-build --verbosity normal
      - run: dotnet test tests/SqlDataPack.Cli.Tests/SqlDataPack.Cli.Tests.csproj -c Release --no-build --verbosity normal

      # Two packages: the library, and the CLI as a dotnet global tool. SqlDataPack.Cli
      # needs its own trusted-publishing policy on nuget.org or the push 403s after the
      # tag is already live.
      - name: Pack
        run: |
          dotnet pack src/SqlDataPack/SqlDataPack.csproj -c Release --no-build -o ./release-packages -p:Version=${{ needs.guard.outputs.version }}
          dotnet pack src/SqlDataPack.Cli/SqlDataPack.Cli.csproj -c Release --no-build -o ./release-packages -p:Version=${{ needs.guard.outputs.version }}

      # The version is passed into build and pack explicitly, so this asserts the
      # artifacts on disk are the ones the tag promised before anything is published.
      # Named rather than counted: a missing package and an unexpected extra one are
      # both worth failing on.
      - name: Verify package versions match the tag
        env:
          EXPECTED: ${{ needs.guard.outputs.version }}
        run: |
          missing=0
          for id in SqlDataPack SqlDataPack.Cli; do
            if [ ! -f "./release-packages/${id}.${EXPECTED}.nupkg" ]; then
              echo "::error::Expected ${id}.${EXPECTED}.nupkg."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "Pack produced:"
            ls -1 ./release-packages/
            exit 1
          fi

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-packages
          path: |
            ./release-packages/*.nupkg
            ./release-packages/*.snupkg

      - name: Download standalone binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          merge-multiple: true
          path: ./release-binaries

      # winget verifies the installer against this hash, and anyone downloading by hand
      # has nothing else to check the file against.
      - name: Checksums
        run: |
          cd ./release-binaries
          sha256sum * > ./SHA256SUMS
          cat ./SHA256SUMS
          echo '## Downloads' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat ./SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Attest the bytes we built, before publishing. nuget.org appends a repository
      # signature to the published package, which changes its bytes and invalidates this
      # attestation when verified against the nuget.org file. The attestation bundle and
      # the exact attested nupkg are therefore attached to the GitHub release below, and
      # the README documents verifying against that file. The standalone binaries are
      # attested too: they are unsigned, so provenance is the only thing anyone can check.
      - name: Attest build provenance
        id: attest
        if: needs.guard.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            ./release-packages/*.nupkg
            ./release-binaries/sqldatapack-*

      - name: Generate SBOM (CycloneDX)
        run: |
          dotnet tool install --global CycloneDX --version 6.2.0
          dotnet CycloneDX src/SqlDataPack/SqlDataPack.csproj -o ./sbom --output-format Json --set-version "${{ needs.guard.outputs.version }}"
          dotnet CycloneDX src/SqlDataPack.Cli/SqlDataPack.Cli.csproj -o ./sbom-cli --output-format Json --set-version "${{ needs.guard.outputs.version }}"
          mv ./sbom/bom.json ./sbom/sqldatapack-sbom.json
          mv ./sbom-cli/bom.json ./sbom/sqldatapack-cli-sbom.json

      # Before the pushes, not after. Generating notes calls the GitHub API and can fail;
      # doing it afterwards means failing once the packages are already on nuget.org and
      # cannot be taken back. Everything that can fail runs before the first push.
      #
      # Notes are generated from the pull requests merged since the previous tag, so a
      # pull request title is what readers eventually see. The readable, narrative
      # account of the project lives on the docs site and is not tied to a version.
      # Runs on dry runs too, so a rehearsal shows exactly what the release would say.
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          previous=$(git tag --list 'v*' --sort=-v:refname | grep -Fxv "v${VERSION}" | head -1)
          if [ -n "${previous}" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="v${VERSION}" -f previous_tag_name="${previous}" \
              --jq '.body' > ./release-notes.md
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="v${VERSION}" --jq '.body' > ./release-notes.md
          fi
          echo "## Release notes for v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          cat ./release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: NuGet login (OIDC trusted publishing)
        if: needs.guard.outputs.publish == 'true'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      # One push per package, named rather than globbed, CLI first. A glob pushes the
      # library first, so a refusal on the CLI would leave the library on nuget.org
      # permanently with no CLI, no GitHub release and no winget submission. The CLI is
      # the only push that can plausibly fail, so it goes where a failure costs nothing.
      - name: Push the CLI to NuGet.org
        if: needs.guard.outputs.publish == 'true'
        run: dotnet nuget push "./release-packages/SqlDataPack.Cli.${{ needs.guard.outputs.version }}.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Push the library to NuGet.org
        if: needs.guard.outputs.publish == 'true'
        run: dotnet nuget push "./release-packages/SqlDataPack.${{ needs.guard.outputs.version }}.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

      # Symbols stay a glob: a failed snupkg push does not half-release anything.
      - name: Push symbols to NuGet.org
        if: needs.guard.outputs.publish == 'true'
        run: dotnet nuget push "./release-packages/*.snupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

      # Prereleases are marked as such, so a preview does not display as
      # "Latest" on the releases page.
      - name: Create GitHub Release
        if: needs.guard.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" ./release-packages/provenance.intoto.jsonl
          gh release create "v${VERSION}" \
            ./release-packages/*.nupkg \
            ./release-binaries/sqldatapack-* \
            ./release-binaries/SHA256SUMS \
            ./sbom/sqldatapack-sbom.json \
            ./sbom/sqldatapack-cli-sbom.json \
            ./release-packages/provenance.intoto.jsonl \
            -t "v${VERSION}" \
            --notes-file ./release-notes.md \
            ${{ needs.guard.outputs.prerelease == 'true' && '--prerelease' || '--latest' }}

  # winget is the channel most people will actually use, so this runs on every stable
  # release. The first submission has to be done by hand -- microsoft/winget-pkgs reviews
  # a new package identifier before it accepts automated updates -- and the manifests to
  # copy for it live in build/winget/.
  #
  # Needs WINGET_TOKEN: a PAT with public_repo scope on an account that has forked
  # microsoft/winget-pkgs. Set the WINGET_PACKAGE_LIVE repository variable to true at the
  # same time, once the hand-submitted manifest has merged. Until then this skips with a
  # warning, because wingetcreate cannot update an identifier winget-pkgs has never seen.
  # After that a missing token is a hard failure: winget is the channel most people use,
  # and a silently skipped submission leaves it stale until someone reports an old
  # version. Failing here is safe, everything else has already published.
  winget:
    name: Submit winget manifest
    needs: [guard, release]
    if: needs.guard.outputs.publish == 'true' && needs.guard.outputs.prerelease != 'true'
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      PACKAGE_LIVE: ${{ vars.WINGET_PACKAGE_LIVE }}
      VERSION: ${{ needs.guard.outputs.version }}
      PACKAGE_ID: zachtbeer.SqlDataPack

    steps:
      - name: Check for a submission token
        id: token
        shell: bash
        run: |
          if [ "${PACKAGE_LIVE}" != "true" ]; then
            echo "::warning::${PACKAGE_ID} is not in winget-pkgs yet, so nothing was submitted. Submit the manifests in build/winget/ by hand, then set the WINGET_TOKEN secret and the WINGET_PACKAGE_LIVE variable to true."
            echo "submit=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${WINGET_TOKEN}" ]; then
            echo "::error::WINGET_PACKAGE_LIVE is set but WINGET_TOKEN is not, so ${PACKAGE_ID} would silently stay on an older version. Restore the secret and re-run this job."
            exit 1
          else
            echo "submit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit to winget-pkgs
        if: steps.token.outputs.submit == 'true'
        shell: pwsh
        run: |
          $base = "https://github.com/${env:GITHUB_REPOSITORY}/releases/download/v${env:VERSION}"
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update $env:PACKAGE_ID `
            --version $env:VERSION `
            --urls "$base/sqldatapack-win-x64.exe|x64" "$base/sqldatapack-win-arm64.exe|arm64" `
            --submit `
            --token $env:WINGET_TOKEN
