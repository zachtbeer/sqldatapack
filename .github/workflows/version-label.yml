name: Version label

# Every pull request that changes the package must say how big the change is, and
# every pull request that does not must not claim to. publish.yml reads these labels
# back off the merged pull request to decide the next version, so this gate is the
# only place a version decision is made by a human.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    name: Semver label
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check the label against the files changed
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Changing any of these changes what consumers receive. The two props files
          # are in the list because a dependency version bump there alters the shipped
          # package without touching a single .cs file. The CLI is in the list because it
          # and the library release in lockstep, so a CLI-only fix still needs a version.
          touched=0
          while IFS= read -r file; do
            case "${file}" in
              src/SqlDataPack/*|src/SqlDataPack.Cli/*|build/winget/*|Directory.Build.props|Directory.Packages.props)
                touched=1
                echo "package file: ${file}"
                ;;
            esac
          done < <(gh pr view "${PR}" --repo "${GITHUB_REPOSITORY}" --json files --jq '.files[].path')

          labels=$(gh pr view "${PR}" --repo "${GITHUB_REPOSITORY}" --json labels --jq '.labels[].name')

          count=0
          chosen=""
          for level in major minor patch none; do
            if printf '%s\n' "${labels}" | grep -qx "semver:${level}"; then
              count=$((count + 1))
              chosen="${level}"
            fi
          done

          if [ "${touched}" -eq 1 ] && [ "${count}" -ne 1 ]; then
            echo "::error::This pull request changes the package, so it needs exactly one of semver:major, semver:minor, semver:patch or semver:none. It has ${count}."
            echo "Use semver:none for a change with no effect on anyone using the package."
            exit 1
          fi

          if [ "${touched}" -eq 0 ] && [ "${count}" -ne 0 ]; then
            echo "::error::This pull request carries a semver: label but changes nothing in the package. Remove the label."
            exit 1
          fi

          if [ "${touched}" -eq 1 ]; then
            echo "Package change labelled semver:${chosen}."
          else
            echo "No package files changed, no label needed."
          fi
