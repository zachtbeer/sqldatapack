name: Standalone binaries

# Proves the six standalone builds still work, on every push to main.
#
# release.yml builds the same six RIDs and is the one that publishes them. This runs the
# same matrix with nothing attached: no upload, no version, no release. The point is
# where it runs, not what it produces. A pull request would pay six publishes for a
# change that usually cannot break them, and finding out on the tag means finding out
# after the tag is live and irreversible. main is merges only, so a broken cross-publish
# surfaces within one merge on a job nobody is waiting for.
#
# The matrix is duplicated from release.yml rather than shared through workflow_call.
# Twelve lines of duplication is cheaper to read at 2am than a fourth workflow file and
# a layer of indirection.

on:
  push:
    branches: [main]
    paths:
      - 'src/SqlDataPack.Cli/**'
      - 'src/SqlDataPack/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/binaries.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # No --locked-mode: publishing for a RID pulls runtime packs the lock file was not
      # written against. The version is a placeholder; nothing here is published.
      - name: Publish
        shell: bash
        run: |
          dotnet publish src/SqlDataPack.Cli/SqlDataPack.Cli.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:Version=0.0.0-ci \
            -o ./publish/${{ matrix.rid }}

      # The publish settings are supposed to produce exactly one file. If they ever stop
      # doing so, the archive layout and the winget manifest are both wrong. Failing here
      # is the cheap version of failing on the tag.
      - name: Verify the build is a single file
        shell: bash
        run: |
          count=$(find ./publish/${{ matrix.rid }} -type f | wc -l)
          if [ "${count}" -ne 1 ]; then
            echo "::error::Expected one self-contained file for ${{ matrix.rid }}, found ${count}:"
            find ./publish/${{ matrix.rid }} -type f
            exit 1
          fi

      # Only where the runner can execute the architecture it just built.
      - name: Smoke test
        if: matrix.rid == 'win-x64' || matrix.rid == 'linux-x64' || matrix.rid == 'osx-arm64'
        shell: bash
        run: |
          case "${{ matrix.rid }}" in
            win-*) ./publish/${{ matrix.rid }}/SqlDataPack.Cli.exe --version ;;
            *)
              chmod +x "./publish/${{ matrix.rid }}/SqlDataPack.Cli"
              ./publish/${{ matrix.rid }}/SqlDataPack.Cli --version
              ;;
          esac
