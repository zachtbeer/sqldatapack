    startLine: 221
  assemblies:
  - SqlDataPack
  namespace: SqlDataPack.Models
  summary: >-
    Configures a SQL Server WHERE predicate that applies to every selected export table containing a

    given set of columns.
  remarks: >-
    <p>

    The named columns gate the predicate: a table is filtered only when it has <em>every</em> column in

    <xref href="SqlDataPack.Models.GlobalWhereClause.ColumnNames" data-throw-if-not-resolved="false"></xref>. Tables missing any of them are exported unfiltered. This is what makes a

    multi-column clause different from several single-column ones — the latter apply independently

    wherever each column happens to exist.

    </p>

    <pre><code class="lang-csharp">// Applies only to tables that have BOTH TenantId and IsDeleted.

    new GlobalWhereClause(["TenantId", "IsDeleted"], "TenantId = 123 AND IsDeleted = 0")</code></pre>

    <p>

    Gating looks at the table's source columns, so a predicate may reference a column excluded from the

    exported output via <xref href="SqlDataPack.Models.ExportOptions.ExcludeColumns" data-throw-if-not-resolved="false"></xref>.

    </p>
  example: []
  syntax:
    content: 'public sealed record GlobalWhereClause : IEquatable<GlobalWhereClause>'
