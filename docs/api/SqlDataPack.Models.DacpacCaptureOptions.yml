- uid: SqlDataPack.Models.DacpacCaptureOptions.VerifyExtraction
  commentId: P:SqlDataPack.Models.DacpacCaptureOptions.VerifyExtraction
  id: VerifyExtraction
  parent: SqlDataPack.Models.DacpacCaptureOptions
  langs:
  - csharp
  - vb
  name: VerifyExtraction
  nameWithType: DacpacCaptureOptions.VerifyExtraction
  fullName: SqlDataPack.Models.DacpacCaptureOptions.VerifyExtraction
  type: Property
  source:
    remote:
      path: src/SqlDataPack/Options.cs
      branch: main
      repo: https://github.com/zachtbeer/sqldatapack.git
    id: VerifyExtraction
    path: src/SqlDataPack/Options.cs
    startLine: 112
  assemblies:
  - SqlDataPack
  namespace: SqlDataPack.Models
  summary: Runs DacFx's post-extraction model verification. Defaults to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>.
  remarks: >-
    <p>

    Verification only <em>validates</em> the model DacFx has already built — it does not change which objects are extracted or the resulting dacpac bytes, and it is independent of the deploy-side <xref href="SqlDataPack.Models.DacpacDeploymentOptions.VerifyDeployment" data-throw-if-not-resolved="false"></xref> check. Leaving it off therefore captures exactly the same schema while avoiding <code>SQL71501</code> "unresolved reference" failures on procedures, views, and functions that work in the live source database but defeat DacFx's stricter static validator — ambiguous unqualified columns in multi-table joins, cross-database or three-part names, temp tables, and other deferred-resolvable references. These are common in real, legacy databases and create and run correctly on the target via SQL Server's own binding / deferred name resolution.

    </p>

    <p>

    Set to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> to fail the export early when a captured object has a genuinely unresolvable reference (for example, a column that no longer exists on an existing table), rather than discovering it at deploy time. Note that verification has no per-rule suppression: enabling it re-enables <em>all</em> model-validation rules, so a single benign false positive will block the whole export.

    </p>
  example: []
  syntax:
    content: public bool VerifyExtraction { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property VerifyExtraction As Boolean
  overload: SqlDataPack.Models.DacpacCaptureOptions.VerifyExtraction*
