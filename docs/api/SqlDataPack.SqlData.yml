  namespace: SqlDataPack
  summary: Exports selected SQL Server user tables into a SQLite package.
  example: []
  syntax:
    content: public static Task<SqlDataPackResult> ExportAsync(string sqlServerConnectionString, string sqliteFilePath, ExportOptions? options = null, CancellationToken cancellationToken = default)
    parameters:
    - id: sqlServerConnectionString
      type: System.String
      description: The SQL Server source connection string.
    - id: sqliteFilePath
      type: System.String
      description: The destination SQLite package path.
    - id: options
      type: SqlDataPack.Models.ExportOptions
      description: The export options. When omitted, all user tables are exported.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: A token used to cancel the operation.
    return:
      type: System.Threading.Tasks.Task{SqlDataPack.Models.SqlDataPackResult}
      description: A summary of exported tables, rows, and warnings.
