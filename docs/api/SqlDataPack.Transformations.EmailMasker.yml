  assemblies:
  - SqlDataPack
  namespace: SqlDataPack.Transformations
  summary: 'Masks an email address, keeping it email-shaped: <code>jane.doe@contoso.com</code> becomes <code>j*******@contoso.com</code>.'
  remarks: >-
    Masking is lossy on purpose — many addresses map to one output — so it does not preserve uniqueness. A value

    that is not email-shaped is still masked and given an <code>example.invalid</code> domain rather than passed through.
  example: []
  syntax:
