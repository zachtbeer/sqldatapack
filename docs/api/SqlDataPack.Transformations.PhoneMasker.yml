  assemblies:
  - SqlDataPack
  namespace: SqlDataPack.Transformations
  summary: 'Masks a phone number, keeping its punctuation: <code>(206) 555-1212</code> becomes <code>(XXX) XXX-XXXX</code>.'
  remarks: >-
    Formatting is preserved by position rather than parsed, so <code>206-555-1212</code> and <code>2065551212</code> keep

    their own shapes. Masking maps many numbers onto one output and does not preserve uniqueness.
  example: []
  syntax:
    content: 'public sealed class PhoneMasker : BuiltInTransformer, IValueTransformer'
    content.vb: Public NotInheritable Class PhoneMasker Inherits BuiltInTransformer Implements IValueTransformer
