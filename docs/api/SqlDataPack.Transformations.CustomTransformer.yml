  namespace: SqlDataPack.Transformations
  summary: Transforms one non-null source value.
  example: []
  syntax:
    content: public object? Transform(TransformContext context, object value)
    parameters:
    - id: context
      type: SqlDataPack.Transformations.TransformContext
      description: "The destination column's contract: name, SQL Server type, nullability, and size."
    - id: value
      type: System.Object
      description: The source value, never <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> and never <xref href="System.DBNull" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Object
      description: The value to write, or <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> to write NULL (nullable columns only).
