  assemblies:
  - SqlDataPack
  namespace: SqlDataPack.Transformations
  summary: Wraps a delegate as an <xref href="SqlDataPack.Transformations.IValueTransformer" data-throw-if-not-resolved="false"></xref>, so a one-off transformation does not need its own type.
  remarks: >-
    The delegate is called once per non-null cell of the bound column and must be safe to call repeatedly.

    It is recorded in the package as <code>Custom</code>; SqlDataPack does not try to name it.
