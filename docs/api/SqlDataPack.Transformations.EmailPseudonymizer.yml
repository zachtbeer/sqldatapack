  assemblies:
  - SqlDataPack
  namespace: SqlDataPack.Transformations
  summary: >-
    Replaces an email address with a deterministic pseudonym: <code>jane.doe@contoso.com</code> becomes something like

    <code>u3f19c0a84be7d215@example.invalid</code>.
  remarks: >-
    Deterministic within one export — the same address maps to the same pseudonym in every table and column, so

    joins across <code>Customers.Email</code> and <code>Orders.ContactEmail</code> survive — and different across exports.

    Collisions are unlikely but not impossible; uniqueness is not guaranteed.
  example: []
