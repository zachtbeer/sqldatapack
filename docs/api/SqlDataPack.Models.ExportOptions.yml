  commentId: P:SqlDataPack.Models.ExportOptions.ExcludeSsmsDiagrams
  id: ExcludeSsmsDiagrams
  parent: SqlDataPack.Models.ExportOptions
  langs:
  - csharp
  - vb
  name: ExcludeSsmsDiagrams
  nameWithType: ExportOptions.ExcludeSsmsDiagrams
  fullName: SqlDataPack.Models.ExportOptions.ExcludeSsmsDiagrams
  type: Property
  source:
    remote:
      path: src/SqlDataPack/Options.cs
      branch: zb/v1-prep
      repo: https://github.com/zachtbeer/sqldatapack.git
    id: ExcludeSsmsDiagrams
    path: src/SqlDataPack/Options.cs
    startLine: 474
  assemblies:
  - SqlDataPack
  namespace: SqlDataPack.Models
  summary: >-
    Excludes the <code>dbo.sysdiagrams</code> data rows from the export. SQL Server Management Studio's "Database Diagrams"

    feature creates this table as a regular user table (<code>is_ms_shipped = 0</code>), so it is otherwise exported like any

    other table even though its rows are editor metadata. Defaults to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>.
  remarks: >-
    This affects only the exported data rows; the dacpac schema path is unaffected, so the diagram objects (the table,

    helper procedures, and function) are still captured at the configured <xref href="SqlDataPack.Models.DacpacCaptureOptions.SchemaScope" data-throw-if-not-resolved="false"></xref>.

    The exclusion is unconditional when <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>: even if you explicitly select <code>dbo.sysdiagrams</code> via

    <xref href="SqlDataPack.Models.ExportOptions.TableSelection" data-throw-if-not-resolved="false"></xref>/<xref href="SqlDataPack.Models.ExportOptions.Tables" data-throw-if-not-resolved="false"></xref>, set this to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a> to export its rows.
  example: []
  syntax:
    content: public bool ExcludeSsmsDiagrams { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property ExcludeSsmsDiagrams As Boolean
  overload: SqlDataPack.Models.ExportOptions.ExcludeSsmsDiagrams*
