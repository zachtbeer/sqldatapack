- uid: SqlDataPack.Models.ExportOptions.Transformations
  commentId: P:SqlDataPack.Models.ExportOptions.Transformations
  id: Transformations
  parent: SqlDataPack.Models.ExportOptions
  langs:
  - csharp
  - vb
  name: Transformations
  nameWithType: ExportOptions.Transformations
  fullName: SqlDataPack.Models.ExportOptions.Transformations
  type: Property
  source:
    remote:
      path: src/SqlDataPack/Options.cs
      branch: zb/v1-prep
      repo: https://github.com/zachtbeer/sqldatapack.git
    id: Transformations
    path: src/SqlDataPack/Options.cs
    startLine: 394
  assemblies:
  - SqlDataPack
  namespace: SqlDataPack.Models
  summary: >-
    Transformers bound to fully qualified column paths (<code>schema.table.column</code>), applied to each non-NULL

    source value during export so the original never reaches the package. Defaults to an empty dictionary

    (no transformation).
  remarks: >-
    <p>

    A column takes one transformer; there is no chaining, no name matching, and no automatic detection. Bind

    a built-in from <code>SqlDataPack.Transformations</code> or your own <xref href="SqlDataPack.Transformations.IValueTransformer" data-throw-if-not-resolved="false"></xref>:

    </p>

    <pre><code class="lang-csharp">options.Transformations.Add("dbo.Customers.Email", new EmailPseudonymizer());

    options.Transformations.Add("dbo.Customers.LastName", new NameMasker(new NameMaskerOptions { PreserveCharacters = 2, Suffix = "test" }));</code></pre>

    <p>

    A source NULL bypasses the transformer and stays NULL. Everything else fails the export rather than

    falling back: a transformer that throws, one that returns NULL for a non-nullable column, and one whose

    result does not fit the destination column's type, length, precision, or scale.

    </p>
  example: []
  syntax:
    content: public IDictionary<string, IValueTransformer> Transformations { get; set; }
    parameters: []
    return:
      type: System.Collections.Generic.IDictionary{System.String,SqlDataPack.Transformations.IValueTransformer}
    content.vb: Public Property Transformations As IDictionary(Of String, IValueTransformer)
  overload: SqlDataPack.Models.ExportOptions.Transformations*
