    id: Default
    path: src/SqlDataPack/Options.cs
    startLine: 335
  assemblies:
  - SqlDataPack
  namespace: SqlDataPack.Models
  summary: >-
    Returns a new <xref href="SqlDataPack.Models.ExportOptions" data-throw-if-not-resolved="false"></xref> populated with the conservative, <strong>value-stable</strong> defaults — a convenient starting point to tweak.

    Each access returns a fresh instance, so mutating the returned object never affects subsequent callers.

    Value-identical to <code>new ExportOptions()</code>; the property initializers below are the single source of truth.
  remarks: >-
    The values returned here are part of the library's stable contract: they will not change across releases. Pin to

    <xref href="SqlDataPack.Models.ExportOptions.Default" data-throw-if-not-resolved="false"></xref> (or set the relevant properties explicitly) when you need behaviour that stays identical on upgrade.

    For tuning that tracks the library's latest recommendations, use <xref href="SqlDataPack.Models.ExportOptions.Latest" data-throw-if-not-resolved="false"></xref> instead.
  example: []
  syntax:
    content: public static ExportOptions Default { get; }
    parameters: []
    return:
      type: SqlDataPack.Models.ExportOptions
    content.vb: Public Shared ReadOnly Property [Default] As ExportOptions
  overload: SqlDataPack.Models.ExportOptions.Default*
- uid: SqlDataPack.Models.ExportOptions.Latest
  commentId: P:SqlDataPack.Models.ExportOptions.Latest
  id: Latest
  parent: SqlDataPack.Models.ExportOptions
  langs:
  - csharp
  - vb
  name: Latest
  nameWithType: ExportOptions.Latest
  fullName: SqlDataPack.Models.ExportOptions.Latest
  type: Property
  source:
    remote:
      path: src/SqlDataPack/Options.cs
      branch: zb/v1-prep
      repo: https://github.com/zachtbeer/sqldatapack.git
    id: Latest
    path: src/SqlDataPack/Options.cs
    startLine: 354
  assemblies:
  - SqlDataPack
  namespace: SqlDataPack.Models
  summary: >-
    Returns a new <xref href="SqlDataPack.Models.ExportOptions" data-throw-if-not-resolved="false"></xref> populated with the library's current best-throughput tuning. Use this when you

    want the export to follow our latest recommendations automatically rather than pinning specific values.
  remarks: >-
    <p>

    Unlike <xref href="SqlDataPack.Models.ExportOptions.Default" data-throw-if-not-resolved="false"></xref>, the values returned here are <strong>not value-stable</strong>: they may change in any minor

    release as the recommended tuning evolves (changes are called out in the release notes). If you need behaviour that stays

    byte-for-byte identical across upgrades, use <xref href="SqlDataPack.Models.ExportOptions.Default" data-throw-if-not-resolved="false"></xref> or set the properties explicitly.

    </p>

    <p>

    As of this release it raises <xref href="SqlDataPack.Models.ExportOptions.BatchSize" data-throw-if-not-resolved="false"></xref> to <code>5,000</code> and <xref href="SqlDataPack.Models.ExportOptions.MaxBatchBytes" data-throw-if-not-resolved="false"></xref> to 8 MiB versus

    <xref href="SqlDataPack.Models.ExportOptions.Default" data-throw-if-not-resolved="false"></xref> — faster on typical and narrow tables while the per-batch memory ceiling stays bounded. The

    large-table safety net (<xref href="SqlDataPack.Models.ExportOptions.LargeTableBatchSize" data-throw-if-not-resolved="false"></xref> and its thresholds) is left at the conservative defaults, so

    genuinely huge tables stay memory-safe.

    </p>
  example: []
  syntax:
    content: public static ExportOptions Latest { get; }
    parameters: []
    return:
      type: SqlDataPack.Models.ExportOptions
    content.vb: Public Shared ReadOnly Property Latest As ExportOptions
  overload: SqlDataPack.Models.ExportOptions.Latest*
