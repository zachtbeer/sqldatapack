- uid: SqlDataPack.Models.DacpacDeploymentOptions.AdaptAzureSourceForOnPremTarget
  commentId: P:SqlDataPack.Models.DacpacDeploymentOptions.AdaptAzureSourceForOnPremTarget
  id: AdaptAzureSourceForOnPremTarget
  parent: SqlDataPack.Models.DacpacDeploymentOptions
  langs:
  - csharp
  - vb
  name: AdaptAzureSourceForOnPremTarget
  nameWithType: DacpacDeploymentOptions.AdaptAzureSourceForOnPremTarget
  fullName: SqlDataPack.Models.DacpacDeploymentOptions.AdaptAzureSourceForOnPremTarget
  type: Property
  source:
    remote:
      path: src/SqlDataPack/Options.cs
      branch: main
      repo: https://github.com/zachtbeer/sqldatapack.git
    id: AdaptAzureSourceForOnPremTarget
    path: src/SqlDataPack/Options.cs
    startLine: 193
  assemblies:
  - SqlDataPack
  namespace: SqlDataPack.Models
  summary: Rewrites Azure SQL-specific model elements on a temp copy of the dacpac when deploying an Azure-source extract to an on-prem (non-Azure) target, so DacFx no longer scripts prerequisites the target cannot satisfy. Defaults to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>.
  remarks: >-
    <p>

    When <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>, the deploy probes <code>SERVERPROPERTY('EngineEdition')</code> on the target and — if the source package was stamped as Azure SQL (edition 5 / 8 / 11 / 12) and the target is non-Azure — performs the following model.xml mutations before invoking DacFx:

    </p>

    <ul><li>Removes the optional <code>Containment</code> property from <code>SqlDatabaseOptions</code>.</li><li>Rewrites <code>SqlUser</code> elements whose <code>AuthenticationType</code> is 2 (contained password user) or 4 (Entra / external provider) to <code>IsWithoutLogin=True</code>, dropping the <code>Password</code> / <code>Sid</code> properties. The element is kept (not deleted) so model-internal references stay valid.</li></ul>

    <p>

    Without this rewrite, DacFx emits <code>ALTER DATABASE ... SET CONTAINMENT = PARTIAL</code> as a deploy-script prerequisite, which fails with Msg 12824 on targets where <code>sp_configure 'contained database authentication'</code> is 0.

    </p>

    <p>

    Set this to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a> to deploy the source model verbatim. Useful when you want the deploy to fail loudly so you can fix the source dacpac upstream, or when the operator has already configured <code>contained database authentication = 1</code> on the target and wants the original users preserved.

    </p>

    <p>

    The probe failing aborts the deploy with a <xref href="SqlDataPack.Models.SqlDataPackException" data-throw-if-not-resolved="false"></xref>; disable this flag or <xref href="SqlDataPack.Models.DacpacDeploymentOptions.DeployDatabaseOptions" data-throw-if-not-resolved="false"></xref> to bypass it. The source-platform signal travels in the SQLite package (column <code>source_engine_edition</code> on <code>zsdp_schema_packages</code>); packages produced before that column existed are treated as "unknown source" and rewritten the same way a non-Azure target would be probed for, preserving pre-stamp behaviour.

    </p>
  example: []
  syntax:
    content: public bool AdaptAzureSourceForOnPremTarget { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property AdaptAzureSourceForOnPremTarget As Boolean
  overload: SqlDataPack.Models.DacpacDeploymentOptions.AdaptAzureSourceForOnPremTarget*
