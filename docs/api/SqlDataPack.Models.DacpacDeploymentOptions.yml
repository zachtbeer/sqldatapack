  assemblies:
  - SqlDataPack
  namespace: SqlDataPack.Models
  summary: >-
    Applies the source database's <code>ALTER DATABASE</code> property scripts (containment, recovery model, compatibility-adjacent options, etc.) to the target. Defaults to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a> because these settings are usually environment-specific.

    When <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>, cross-platform model adaptation is delegated to <xref href="SqlDataPack.Models.DacpacDeploymentOptions.AdaptAzureSourceForOnPremTarget" data-throw-if-not-resolved="false"></xref>; set this to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> only when you genuinely want the source database options applied verbatim to the target.
