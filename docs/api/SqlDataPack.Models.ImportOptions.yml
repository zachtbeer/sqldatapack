- uid: SqlDataPack.Models.ImportOptions.SuspendTemporalSystemVersioning
  commentId: P:SqlDataPack.Models.ImportOptions.SuspendTemporalSystemVersioning
  id: SuspendTemporalSystemVersioning
  parent: SqlDataPack.Models.ImportOptions
  langs:
  - csharp
  - vb
  name: SuspendTemporalSystemVersioning
  nameWithType: ImportOptions.SuspendTemporalSystemVersioning
  fullName: SqlDataPack.Models.ImportOptions.SuspendTemporalSystemVersioning
  type: Property
  source:
    remote:
      path: src/SqlDataPack/Options.cs
      branch: zb/v1-prep
      repo: https://github.com/zachtbeer/sqldatapack.git
    id: SuspendTemporalSystemVersioning
    path: src/SqlDataPack/Options.cs
    startLine: 626
  assemblies:
  - SqlDataPack
  namespace: SqlDataPack.Models
  summary: >-
    Handles system-versioned temporal tables on the target by temporarily setting <code>SYSTEM_VERSIONING = OFF</code>

    and dropping the <code>SYSTEM_TIME</code> period before loading, then re-adding the period and re-enabling versioning.

    Defaults to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>.
  remarks: >-
    Without this, importing a temporal table fails: SQL Server rejects direct inserts into the history table

    (Msg 13560) and into the <code>GENERATED ALWAYS</code> period columns of the current table (Msg 13536). The

    ceremony lets the import reload both the current and history rows with their original

    <code>ValidFrom</code>/<code>ValidTo</code> values, and re-applies a finite <code>HISTORY_RETENTION_PERIOD</code> (which

    <code>SET SYSTEM_VERSIONING = OFF</code> would otherwise reset to INFINITE). The period is dropped only when the

    package actually carries the period columns; when it does not (a non-temporal source loaded into a

    temporal target, or period columns excluded during export) versioning stays on and SQL Server

    auto-populates the period. Set to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a> to load every target table as-is and let those

    inserts fail loudly — useful when the target has no temporal tables and you want to skip the catalog

    probe, or when temporal handling is managed externally.
  example: []
  syntax:
    content: public bool SuspendTemporalSystemVersioning { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property SuspendTemporalSystemVersioning As Boolean
  overload: SqlDataPack.Models.ImportOptions.SuspendTemporalSystemVersioning*
- uid: SqlDataPack.Models.ImportOptions.TemporalDataConsistencyCheck
  commentId: P:SqlDataPack.Models.ImportOptions.TemporalDataConsistencyCheck
  id: TemporalDataConsistencyCheck
  parent: SqlDataPack.Models.ImportOptions
  langs:
  - csharp
  - vb
  name: TemporalDataConsistencyCheck
  nameWithType: ImportOptions.TemporalDataConsistencyCheck
  fullName: SqlDataPack.Models.ImportOptions.TemporalDataConsistencyCheck
  type: Property
  source:
    remote:
      path: src/SqlDataPack/Options.cs
      branch: zb/v1-prep
      repo: https://github.com/zachtbeer/sqldatapack.git
    id: TemporalDataConsistencyCheck
    path: src/SqlDataPack/Options.cs
    startLine: 640
  assemblies:
  - SqlDataPack
  namespace: SqlDataPack.Models
  summary: >-
    When re-enabling system versioning after a temporal load, runs SQL Server's <code>DATA_CONSISTENCY_CHECK</code>

    to validate that the current and history period ranges do not overlap. Defaults to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>.

    Only applies when <xref href="SqlDataPack.Models.ImportOptions.SuspendTemporalSystemVersioning" data-throw-if-not-resolved="false"></xref> is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>.
  remarks: >-
    A faithful full-table export passes the check. It fails (and aborts the import with a descriptive

    <xref href="SqlDataPack.Models.SqlDataPackException" data-throw-if-not-resolved="false"></xref>) when the temporal data is inconsistent — for example when the temporal table

    or its history was filtered with a WHERE clause, a period column was excluded, or the source changed

    mid-export. Set to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a> to re-enable versioning without validation, at the risk of a

    temporal table that returns incorrect <code>AS OF</code> query results.
  example: []
  syntax:
    content: public bool TemporalDataConsistencyCheck { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property TemporalDataConsistencyCheck As Boolean
  overload: SqlDataPack.Models.ImportOptions.TemporalDataConsistencyCheck*
