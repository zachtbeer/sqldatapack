    id: Default
    path: src/SqlDataPack/Options.cs
    startLine: 501
  assemblies:
  - SqlDataPack
  namespace: SqlDataPack.Models
  summary: >-
    Returns a new <xref href="SqlDataPack.Models.ImportOptions" data-throw-if-not-resolved="false"></xref> populated with the conservative, <strong>value-stable</strong> defaults — a convenient starting point to tweak.

    Each access returns a fresh instance, so mutating the returned object never affects subsequent callers.

    Value-identical to <code>new ImportOptions()</code>; the property initializers below are the single source of truth.
  remarks: >-
    The values returned here are part of the library's stable contract: they will not change across releases. Pin to

    <xref href="SqlDataPack.Models.ImportOptions.Default" data-throw-if-not-resolved="false"></xref> (or set the relevant properties explicitly) when you need behaviour that stays identical on upgrade.

    For tuning that tracks the library's latest recommendations, use <xref href="SqlDataPack.Models.ImportOptions.Latest" data-throw-if-not-resolved="false"></xref> instead.
  example: []
  syntax:
    content: public static ImportOptions Default { get; }
    parameters: []
    return:
      type: SqlDataPack.Models.ImportOptions
    content.vb: Public Shared ReadOnly Property [Default] As ImportOptions
  overload: SqlDataPack.Models.ImportOptions.Default*
- uid: SqlDataPack.Models.ImportOptions.Latest
  commentId: P:SqlDataPack.Models.ImportOptions.Latest
  id: Latest
  parent: SqlDataPack.Models.ImportOptions
  langs:
  - csharp
  - vb
  name: Latest
  nameWithType: ImportOptions.Latest
  fullName: SqlDataPack.Models.ImportOptions.Latest
  type: Property
  source:
    remote:
      path: src/SqlDataPack/Options.cs
      branch: zb/v1-prep
      repo: https://github.com/zachtbeer/sqldatapack.git
    id: Latest
    path: src/SqlDataPack/Options.cs
    startLine: 520
  assemblies:
  - SqlDataPack
  namespace: SqlDataPack.Models
  summary: >-
    Returns a new <xref href="SqlDataPack.Models.ImportOptions" data-throw-if-not-resolved="false"></xref> populated with the library's current best-throughput tuning. Use this when you

    want the import to follow our latest recommendations automatically rather than pinning specific values.
  remarks: >-
    <p>

    Unlike <xref href="SqlDataPack.Models.ImportOptions.Default" data-throw-if-not-resolved="false"></xref>, the values returned here are <strong>not value-stable</strong>: they may change in any minor

    release as the recommended tuning evolves (changes are called out in the release notes). If you need behaviour that stays

    byte-for-byte identical across upgrades, use <xref href="SqlDataPack.Models.ImportOptions.Default" data-throw-if-not-resolved="false"></xref> or set the properties explicitly.

    </p>

    <p>

    As of this release it raises <xref href="SqlDataPack.Models.ImportOptions.BatchSize" data-throw-if-not-resolved="false"></xref> to <code>5,000</code> and <xref href="SqlDataPack.Models.ImportOptions.MaxBatchBytes" data-throw-if-not-resolved="false"></xref> to 8 MiB versus

    <xref href="SqlDataPack.Models.ImportOptions.Default" data-throw-if-not-resolved="false"></xref> — faster bulk-copy on typical and narrow tables while the per-batch memory ceiling stays bounded. The

    large-table safety net (<xref href="SqlDataPack.Models.ImportOptions.LargeTableBatchSize" data-throw-if-not-resolved="false"></xref> and its thresholds) is left at the conservative defaults, so

    genuinely huge tables stay memory-safe.

    </p>
  example: []
  syntax:
    content: public static ImportOptions Latest { get; }
    parameters: []
    return:
      type: SqlDataPack.Models.ImportOptions
    content.vb: Public Shared ReadOnly Property Latest As ImportOptions
  overload: SqlDataPack.Models.ImportOptions.Latest*
