- uid: SqlDataPack.Models.ImportOptions.FailOnLossyTypeMismatch
  commentId: P:SqlDataPack.Models.ImportOptions.FailOnLossyTypeMismatch
  id: FailOnLossyTypeMismatch
  parent: SqlDataPack.Models.ImportOptions
  langs:
  - csharp
  - vb
  name: FailOnLossyTypeMismatch
  nameWithType: ImportOptions.FailOnLossyTypeMismatch
  fullName: SqlDataPack.Models.ImportOptions.FailOnLossyTypeMismatch
  type: Property
  source:
    remote:
      path: src/SqlDataPack/Options.cs
      branch: zb/v1-prep
      repo: https://github.com/zachtbeer/sqldatapack.git
    id: FailOnLossyTypeMismatch
    path: src/SqlDataPack/Options.cs
    startLine: 572
  assemblies:
  - SqlDataPack
  namespace: SqlDataPack.Models
  summary: >-
    Fails the import before any row is copied when a target column would lose data relative to the package:

    a shorter <code>char</code>, <code>varchar</code>, <code>nchar</code>, <code>nvarchar</code>, <code>binary</code> or <code>varbinary</code>,

    a smaller <code>decimal</code> precision or scale, or a smaller <code>datetime2</code>, <code>datetimeoffset</code> or

    <code>time</code> scale. Defaults to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>, in which case every type difference is reported

    as a warning on <xref href="SqlDataPack.Models.SqlDataPackResult.Warnings" data-throw-if-not-resolved="false"></xref> and the import proceeds.
  remarks: >-
    Widening differences and collation differences are always warnings and are never affected by this

    setting. A collation difference can mangle non-ASCII text but cannot be judged from catalog metadata

    alone, and blocking on it would fail every import into a differently collated server.
  example: []
  syntax:
    content: public bool FailOnLossyTypeMismatch { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property FailOnLossyTypeMismatch As Boolean
  overload: SqlDataPack.Models.ImportOptions.FailOnLossyTypeMismatch*
- uid: SqlDataPack.Models.ImportOptions.RowCountDrift
  commentId: P:SqlDataPack.Models.ImportOptions.RowCountDrift
  id: RowCountDrift
  parent: SqlDataPack.Models.ImportOptions
  langs:
  - csharp
  - vb
  name: RowCountDrift
  nameWithType: ImportOptions.RowCountDrift
  fullName: SqlDataPack.Models.ImportOptions.RowCountDrift
  type: Property
  source:
    remote:
      path: src/SqlDataPack/Options.cs
      branch: zb/v1-prep
      repo: https://github.com/zachtbeer/sqldatapack.git
    id: RowCountDrift
    path: src/SqlDataPack/Options.cs
    startLine: 580
  assemblies:
  - SqlDataPack
  namespace: SqlDataPack.Models
  summary: Selects what happens when the package holds a different number of rows than the export recorded, which is what deleting or inserting rows in the package produces. Defaults to <xref href="SqlDataPack.Models.RowCountDrift.Warn" data-throw-if-not-resolved="false"></xref>, in which case the rows the package holds are imported and the difference is reported per table on <xref href="SqlDataPack.Models.SqlDataPackResult.Warnings" data-throw-if-not-resolved="false"></xref>.
  remarks: "This compares the count recorded in the package manifest against the package's own contents, so it only ever answers whether the file changed since export. It is not the check that proves a load completed: that one compares the rows read out of the package against the rows that landed in the target, and it is always fatal. Set this to <xref href=\"SqlDataPack.Models.RowCountDrift.Fail\" data-throw-if-not-resolved=\"false\"></xref> for unattended pipelines that scrub packages automatically, where a count that moved means a script bug rather than a deliberate edit."
  example: []
  syntax:
    content: public RowCountDrift RowCountDrift { get; set; }
    parameters: []
    return:
      type: SqlDataPack.Models.RowCountDrift
    content.vb: Public Property RowCountDrift As RowCountDrift
  overload: SqlDataPack.Models.ImportOptions.RowCountDrift*
